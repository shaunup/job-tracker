# Render.com blueprint — deploys Job Tracker as a single always-on Node web
# service. Unlike serverless, this keeps one long-lived process, so the built-in
# auto-sync polling (SYNC_INTERVAL_MINUTES) works and data persists on the disk.
#
# Deploy: push to GitHub, then in Render choose "New +" -> "Blueprint" and point
# it at this repo. Fill in the Google OAuth secrets when prompted, and set
# GOOGLE_REDIRECT_URI to https://<your-service>.onrender.com/api/auth/google/callback
services:
  - type: web
    name: job-tracker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      - key: SYNC_INTERVAL_MINUTES
        value: "10"
      - key: SYNC_LOOKBACK_DAYS
        value: "365"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
    # A persistent disk keeps your data across restarts/deploys. Disks require a
    # paid instance type; on the free tier remove this block (data then lives in
    # ephemeral storage and resets when the instance restarts).
    disk:
      name: jobtracker-data
      mountPath: /data
      sizeGB: 1
